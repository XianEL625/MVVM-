<!DOCTYPE html>
  <head>
  </head>
  <body>
    <h1>一张网页</h1>
    <p id="demo">一个段落
    </p>
    <button type="button" onclick="myFunction()">试一试</button>
  <div id="output"></div>
  <h1>数据获取示例</h1>  
<button id="fetchButton">获取数据</button>  
  <div id="displayData"></div> 
 </body>
<script>
  function myFunction() {
    document.getElementById("demo").innerHTML = "段落被更改。";
  }
  var myObject;
  myObject = {
  "name": "zs"
}
var oo=document.getElementById("output");
oo.innerHTML=myObject.name;
const x = 10;  
console.log('The value of x is:', x);//这是在控制台显示信息
let text;
for(i=0;i<5;i++){
    text+='数字是'+i+"<br>";
    console.log( text);
}
var person = {fname:"Bill", lname:"Gates", age:62}; //
let text2 = "";
var y;
for (y in person) {
    text2 += person[y];
}
console.log(text2);

const cars = ["BMW", "Volvo", "Mini"];
let text3 = "";
for (let x of cars) {
  text3 += x;
}
console.log(text3);
function toCelsius(fahrenheit) {
    return (5/9) * (fahrenheit-32);
}
document.getElementById("output").innerHTML = toCelsius(77);
var sum = (num1, num2) => num1 + num2;
console.log(sum(1,1));
function fetchData(callback) {  
            setTimeout(() => {  
                const data = { name: 'John', age: 30 };  
                callback(data);  
            }, 1000);  
        }  

        function handleData(data) {  
            console.log('收到的数据:', data);  
            // 你也可以在页面上显示数据:  
            const displayDiv = document.getElementById('displayData');  
            displayDiv.innerText = `名字: ${data.name}, 年龄: ${data.age}`;  
        }  

        document.getElementById('fetchButton').onclick = function() {  
            fetchData(handleData);  
        };   
</script>
</html>
